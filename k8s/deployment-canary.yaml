apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-app-canary
  labels:
    app: aceest-fitness
    version: canary
spec:
  replicas: 1  # With 3 stable replicas, this routes ~25% of traffic to the canary
  selector:
    matchLabels:
      app: aceest-fitness
      version: canary
  template:
    metadata:
      labels:
        app: aceest-fitness  # Matches k8s/service.yaml selector
        version: canary
    spec:
      containers:
        - name: aceest-fitness-container
          image: YOUR_DOCKERHUB_USERNAME/aceest-fitness:canary  # Replace with your new version tag (e.g., 2.1.0)
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10